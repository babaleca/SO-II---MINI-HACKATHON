<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Labirinto dos Processos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="sala">

  <section class="galeria">
    <h1>O labirinto</h1>
    <div class="moldura">
      <div id="grade" class="grade"></div>
      <div id="pecas" class="pecas"></div>
      <div class="vinheta" aria-hidden="true"></div>
    </div>
    <p id="corredor" class="corredor">Corredor estreito livre</p>
  </section>

  <aside class="painel">
    <h2>Exploradores</h2>
    <div id="fichas"></div>
    <button id="criar" class="criar">Criar explorador</button>
    <p id="aviso" class="aviso" role="status"></p>
  </aside>

</main>

<script src="app.js"></script>
</body>
</html>
